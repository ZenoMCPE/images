name: Ruby API Base

on:
  push:
    branches:
      - main
    paths:
      - "ruby-api-base/**"
      - ".github/workflows/ruby-api-base.yml"
  workflow_dispatch:
    inputs:
      ruby-version:
        description: Ruby version tag to build.
        required: true
        default: "3.4"
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zenomcpe/ruby-api-base
  RUBY_VERSION: ${{ github.event.inputs.ruby-version || '3.4' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: build
            suffix: build
          - target: runtime
            suffix: runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ruby-api-base/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            RUBY_VERSION=${{ env.RUBY_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RUBY_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=ruby-api-base-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ruby-api-base-${{ matrix.target }}
