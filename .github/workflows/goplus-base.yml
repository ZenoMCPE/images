name: GoPlus Base

on:
  push:
    branches:
      - main
    paths:
      - "goplus-base/**"
      - ".github/workflows/goplus-base.yml"
  workflow_dispatch:
    inputs:
      bootstrap-go-version:
        description: Go version used to bootstrap the fork.
        required: true
        default: "1.26.4"
        type: string
      goplus-version:
        description: GoPlus version used in the mutable image tag.
        required: true
        default: "1.28-devel"
        type: string
      goplus-repo-url:
        description: GoPlus repository URL.
        required: true
        default: "https://github.com/RestartFU/goplus.git"
        type: string
      goplus-commit-hash:
        description: GoPlus commit hash to install.
        required: true
        default: "ee3aaf3a1d05b3f378c2df051a0b43683233ab81"
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zenomcpe/goplus-base
  BOOTSTRAP_GO_VERSION: ${{ github.event.inputs.bootstrap-go-version || '1.26.4' }}
  GOPLUS_VERSION: ${{ github.event.inputs.goplus-version || '1.28-devel' }}
  GOPLUS_REPO_URL: ${{ github.event.inputs.goplus-repo-url || 'https://github.com/RestartFU/goplus.git' }}
  GOPLUS_COMMIT_HASH: ${{ github.event.inputs.goplus-commit-hash || 'ee3aaf3a1d05b3f378c2df051a0b43683233ab81' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: goplus-base/Dockerfile
          target: base
          build-args: |
            BOOTSTRAP_GO_VERSION=${{ env.BOOTSTRAP_GO_VERSION }}
            GOPLUS_REPO_URL=${{ env.GOPLUS_REPO_URL }}
            GOPLUS_COMMIT_HASH=${{ env.GOPLUS_COMMIT_HASH }}
          push: true
          tags: |
            ${{ env.IMAGE }}:go${{ env.GOPLUS_VERSION }}
            ${{ env.IMAGE }}:go${{ env.GOPLUS_VERSION }}-${{ env.GOPLUS_COMMIT_HASH }}
          cache-from: type=gha,scope=goplus-base
          cache-to: type=gha,mode=max,scope=goplus-base
