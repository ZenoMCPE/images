name: Internal client native builders
run-name: Native ${{ inputs.request_id }} ${{ inputs.source_sha }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA in the private application repository
        required: true
        type: string
      version:
        description: Exact release version at that commit
        required: true
        type: string
      request_id:
        description: Unique UUID generated by the private release pipeline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ZenoMCPE/images' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate build request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 client-native/scripts/native-build.py validate

  build:
    needs: validate
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            jobs: 4
          - platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
            jobs: 3
          - platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            jobs: 4
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      REQUEST_ID: ${{ inputs.request_id }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      GOFLAGS: -p=${{ matrix.jobs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: builder
      - name: Register private source cleanup after dependency caches
        uses: ./builder/client-native/actions/cleanup-private-source
      - name: Read the private release source
        uses: actions/checkout@v5
        with:
          repository: ZenoMCPE/client
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.CLIENT_SOURCE_TOKEN }}
          path: private-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned diagnostics encryption library
        run: |
          python -m pip install --only-binary=:all: cryptography==48.0.1
      - name: Verify source and read its pinned runtime revision
        id: source
        run: python builder/client-native/scripts/native-build.py inspect --source private-source
      - name: Read the public runtime source
        uses: actions/checkout@v5
        with:
          repository: bedrock-mc/cinnabar
          ref: ${{ steps.source.outputs.runtime_sha }}
          persist-credentials: false
          path: private-source/build/cinnabar
      - uses: actions/setup-go@v6
        with:
          go-version-file: private-source/build/cinnabar/core/go.mod
          cache: true
          cache-dependency-path: |
            private-source/build/cinnabar/core/go.sum
            private-source/build/cinnabar/tools/localserver/go.sum
            private-source/build/cinnabar/go.work.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - name: Cache public Rust dependencies without workspace artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-${{ matrix.platform }}-${{ matrix.arch }}
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          workspaces: |
            private-source -> target
            private-source/mods/zeno-client -> target
            private-source/build/cinnabar -> target
      - name: Install pinned Windows setup tooling
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Burn extension installation failed' }
      - name: Test, compile and package without exposing private build output
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          PRIVATE_DEBUG_PUBLIC_KEY: ${{ vars.PRIVATE_DEBUG_PUBLIC_KEY }}
        run: python builder/client-native/scripts/native-build.py build --source private-source --output public-artifacts
      - name: Upload only compiled release packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: public-artifacts/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload encrypted failure diagnostics only
        if: failure() && hashFiles('encrypted-diagnostics/*.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-${{ matrix.platform }}-${{ matrix.arch }}
          path: encrypted-diagnostics/*.enc
          if-no-files-found: error
          retention-days: 3
