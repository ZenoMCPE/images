name: Internal client native builders
run-name: Native ${{ inputs.request_id }} ${{ inputs.source_sha }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA in the private application repository
        required: true
        type: string
      version:
        description: Exact release version at that commit
        required: true
        type: string
      request_id:
        description: Unique UUID generated by the private release pipeline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ZenoMCPE/images' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate build request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 client-native/scripts/native-build.py validate

  build:
    needs: validate
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      REQUEST_ID: ${{ inputs.request_id }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      GOFLAGS: -p=2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: builder
      - name: Read the private release source
        uses: actions/checkout@v5
        with:
          repository: ZenoMCPE/client
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.CLIENT_SOURCE_TOKEN }}
          path: private-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned diagnostics encryption library
        run: |
          python -m pip install --only-binary=:all: cryptography==48.0.1
      - name: Verify source and read its pinned runtime revision
        id: source
        run: python builder/client-native/scripts/native-build.py inspect --source private-source
      - name: Read the public runtime source
        uses: actions/checkout@v5
        with:
          repository: bedrock-mc/cinnabar
          ref: ${{ steps.source.outputs.runtime_sha }}
          persist-credentials: false
          path: private-source/build/cinnabar
      - uses: actions/setup-go@v6
        with:
          go-version-file: private-source/build/cinnabar/core/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - name: Test, compile and package without exposing private build output
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          PRIVATE_DEBUG_PUBLIC_KEY: ${{ vars.PRIVATE_DEBUG_PUBLIC_KEY }}
        run: python builder/client-native/scripts/native-build.py build --source private-source --output public-artifacts
      - name: Upload only the compiled release archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: public-artifacts/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload encrypted failure diagnostics only
        if: failure() && hashFiles('encrypted-diagnostics/*.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-${{ matrix.platform }}-${{ matrix.arch }}
          path: encrypted-diagnostics/*.enc
          if-no-files-found: error
          retention-days: 3
      - name: Remove private source and local build output
        if: always()
        run: python builder/client-native/scripts/native-build.py cleanup --source private-source
